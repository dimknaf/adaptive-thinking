name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # Lint, then the offline suite: no secrets, no endpoint, no .env.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
